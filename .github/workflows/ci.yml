name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements-dev.txt

      - name: Unit tests (efficiency formula, item filters, build selection, refresh guards)
        working-directory: ./backend
        run: python -m pytest -q

      - name: Application imports cleanly
        working-directory: ./backend
        run: python -c "import app"

  frontend:
    name: Frontend typecheck, build and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gold-league/package-lock.json

      - name: Install dependencies
        working-directory: ./gold-league
        run: npm ci

      - name: Typecheck
        working-directory: ./gold-league
        run: npm run typecheck

      - name: Build
        working-directory: ./gold-league
        run: npm run build

      - name: Install test browser
        working-directory: ./gold-league
        run: npx playwright install --with-deps chromium

      - name: Browser tests (full workspace suite)
        working-directory: ./gold-league
        run: npm run test:app

  # User-flow smoke checks against a preview of the production build
  smoke:
    name: Production-build smoke checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: gold-league/package-lock.json

      - name: Install dependencies
        working-directory: ./gold-league
        run: npm ci

      - name: Build against production API
        working-directory: ./gold-league
        run: npm run build
        env:
          VITE_API_BASE_URL: https://valuebuild-web.onrender.com

      - name: Serve preview
        working-directory: ./gold-league
        run: npm run preview &

      - name: Warm production API (free-tier cold start)
        run: curl -s -m 90 https://valuebuild-web.onrender.com/api/health || true

      - name: Run smoke suites
        working-directory: ./gold-league
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          node ../scripts/explorer-smoke.mjs http://localhost:4173
          node ../scripts/compare-smoke.mjs http://localhost:4173
          node ../scripts/builds-smoke.mjs http://localhost:4173
          node ../scripts/hovercard-smoke.mjs http://localhost:4173
          node ../scripts/nav-smoke.mjs http://localhost:4173
          node ../scripts/popover-stability.mjs http://localhost:4173
          node ../scripts/ai-smoke.mjs http://localhost:4173
          node ../scripts/features-smoke.mjs http://localhost:4173
          node ../scripts/pwa-smoke.mjs http://localhost:4173
