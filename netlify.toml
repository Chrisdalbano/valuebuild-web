# Netlify Configuration for Vue 3 + Vite Frontend

[build]
  # Directory where frontend code is located
  base = "gold-league/"
  
  # Build command (install deps first, then build)
  command = "npm ci && npm run build"
  
  # Output directory (Vite default)
  publish = "dist"

# SPA routing - redirect all requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables (set these in Netlify UI)
[build.environment]
  NODE_VERSION = "20"

# Branch-specific deployments — every context MUST install deps first. These
# overrides previously dropped the `npm ci`, so a cold build (after a Netlify
# cache eviction) failed with "vite: not found" and the live site froze on the
# last good deploy.
[context.production]
  command = "npm ci && npm run build"

[context.deploy-preview]
  command = "npm ci && npm run build"

[context.branch-deploy]
  command = "npm ci && npm run build"

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

